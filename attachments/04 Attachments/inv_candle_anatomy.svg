<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="Inter, system-ui, sans-serif" font-size="14">
  <style>.t{fill:#334155}.h{fill:#0F172A;font-weight:650}.g{stroke:#94A3B8;stroke-dasharray:3 4;stroke-width:1}</style>
  <!-- green candle -->
  <text x="150" y="22" text-anchor="middle" class="h">Green (up) candle</text>
  <line x1="150" y1="45" x2="150" y2="290" stroke="#10B981" stroke-width="3"/>
  <rect x="120" y="95" width="60" height="135" rx="3" fill="#10B981"/>
  <line class="g" x1="185" y1="45" x2="250" y2="45"/><text x="256" y="50" class="t">High</text>
  <line class="g" x1="185" y1="95" x2="250" y2="95"/><text x="256" y="100" class="t">Close (top of body)</text>
  <line class="g" x1="185" y1="230" x2="250" y2="230"/><text x="256" y="235" class="t">Open (bottom of body)</text>
  <line class="g" x1="185" y1="290" x2="250" y2="290"/><text x="256" y="295" class="t">Low</text>
  <text x="112" y="72" text-anchor="end" class="t">upper wick</text>
  <text x="112" y="166" text-anchor="end" class="t">body</text>
  <text x="112" y="264" text-anchor="end" class="t">lower wick</text>
  <!-- red candle -->
  <text x="520" y="22" text-anchor="middle" class="h">Red (down) candle</text>
  <line x1="520" y1="45" x2="520" y2="290" stroke="#F43F5E" stroke-width="3"/>
  <rect x="490" y="95" width="60" height="135" rx="3" fill="#F43F5E"/>
  <text x="482" y="100" text-anchor="end" class="t">Open</text>
  <text x="482" y="235" text-anchor="end" class="t">Close</text>
  <text x="560" y="50" class="t">High</text>
  <text x="560" y="295" class="t">Low</text>
  <text x="320" y="322" text-anchor="middle" class="t">Same four prices (OHLC); the colour shows whether it closed above or below where it opened</text>
</svg>
