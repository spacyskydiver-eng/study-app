name = "study-app"
main = "src/index.js"
compatibility_date = "2026-10-01"

[assets]
directory = "."
binding = "ASSETS"
# every request goes through the Worker first, so the PIN check covers the pages and files too
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "textbook-db"
database_id = "3d08b552-4bd0-4e1e-b405-74849513ae17"

# Workers AI: the assistant's answers over mail and calendar (/api/jarvis)
[ai]
binding = "AI"

# the deploy's id: /api/ping returns it so an installed app can tell a new version is out
[version_metadata]
binding = "CF_VERSION"

# the live watchlist checks a couple of its sources (trials, papers, news) every 15 minutes
[triggers]
crons = ["*/15 * * * *"]
